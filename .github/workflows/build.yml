name: Build MAMOOTI VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMOOTI-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

---

### ۳. ذخیره کن
بعد از واردکردن کد، روی **Commit changes** بزن.

### ۴. ساخت APK
۱. وارد مخزن `Mamooti-VPN` شو.
۲. بخش **Actions** رو باز کن.
۳. روی `Build MAMOOTI VPN APK` بزن.
۴. گزینه **Run workflow** رو انتخاب کن.

وقتی اجرا تمام شد و علامت سبز ظاهر شد، پایین صفحه اجرای موفق، بخش **Artifacts** رو پیدا کن و فایل `MAMOOTI-VPN-APK` رو دانلود کن.

**⚠️ نکته مهم:** این کد فقط زمانی APK می‌سازه که محتویات واقعی پروژه اندرویدت، از جمله پوشه `app`، فایل‌های Gradle و در صورت نیاز `gradlew`، داخل مخزن آپلود شده باشند. اگر هنوز فقط فایل `build.yml` رو داری، این کد به‌تنهایی برنامه VPN نمی‌سازه.
